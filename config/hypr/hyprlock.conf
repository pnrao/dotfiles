background {
    monitor =
    path = /usr/share/backgrounds/Resolute_Raccoon_Wallpaper_Dimmed_3840x2160.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgb(122, 162, 247)
    inner_color = rgb(26, 27, 38)
    font_color = rgb(192, 202, 245)
    placeholder_text = <span foreground="##c0caf5">Password...</span>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(192, 202, 245, 1.0)
    font_size = 64
    position = 0, 160
    halign = center
    valign = center
}
