# Omarchy-style Hyprland config (Tokyo Night theme), adapted for Ubuntu + LXQt.

monitor=,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal = wezterm
$fileManager = pcmanfm-qt
$menu = wofi -I --show drun,run --style ~/.config/wofi/style.css

############
### LXQt ###
############

env = QT_QPA_PLATFORMTHEME,lxqt
env = QT_PLATFORM_PLUGIN,lxqt
env = XDG_MENU_PREFIX,lxqt-
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

exec-once = ~/.config/hypr/wallpaper-rotate.sh
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = sleep 3 && nm-tray
exec-once = sleep 3 && blueman-applet
exec-once = sleep 3 && pasystray
exec-once = sleep 2 && lxqt-powermanagement

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    resize_on_border = true
    layout = dwindle
}

cursor {
    no_warps = true
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = false
        range = 15
        render_power = 2
        color = rgba(16161e99)
        offset = 2, 3
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
    new_on_top = true
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_xdg_env_checks = true
    focus_on_activate = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_options = caps:super,lv3:ralt_alt,lv3:lwin_switch,rupeesign:4
    repeat_rate = 30
    repeat_delay = 250
    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################
# Omarchy-style bindings (SUPER as mainmod), kept close to Omarchy defaults
# where they don't collide with your existing muscle memory.

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, exec, $terminal
bind = $mainMod, G, exec, ghostty
bind = $mainMod, F, exec, foot
bind = $mainMod, Q, killactive,
bind = Alt, F4, killactive,
bind = $mainMod, E, exec, uwsm app -- pcmanfm-qt.desktop
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, R, exec, $menu
bind = Alt, F2, exec, $menu
bind = Alt, SPACE, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, X, fullscreen, 1

bind = SUPER, L, exec, hyprlock
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/power_menu.sh
bind = , XF86PowerOff, exec, ~/.config/hypr/power_menu.sh
bind = , Print, exec, slurp | grim -g - - | wl-copy -t image/png

bind = SUPER, S, exec, uwsm app -- subl

# Reload Waybar
bind = $mainMod SHIFT, B, exec, killall -SIGUSR2 waybar

# Reload Hyprland config (closest thing to a "restart" without ending the session)
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = Alt, Tab, cyclenext, visible
bind = Alt SHIFT, Tab, cyclenext, prev, visible

# Media / volume / brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, lxqt-config-brightness -i
bindel = ,XF86MonBrightnessDown, exec, lxqt-config-brightness -d
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = match:class ^(pavucontrol-qt|blueman-manager)$, float on
windowrule = match:class ^(lxqt-.*)$, float on

# No border when a workspace has only one tiled window (matches awesome wm's single-window behavior)
windowrule = border_size 0, match:workspace w[tv1]
# No border when maximized (SUPER+X), even if other windows are tiled behind it
windowrule = border_size 0, match:fullscreen 1
