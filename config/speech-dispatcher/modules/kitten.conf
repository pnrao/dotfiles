# Kitten TTS (nano) via ../kitten-say, which talks to the socket-activated kitten-server
GenericExecuteSynth \
"printf %s \'$DATA\' | $HOME/.config/speech-dispatcher/kitten-say $VOICE $RATE | pw-play --raw --rate 24000 --channels 1 --format s16 -"
AddVoice "en-US" "FEMALE1" "Bella"
AddVoice "en-US" "MALE1" "Jasper"
AddVoice "en-US" "FEMALE1" "Luna"
AddVoice "en-US" "MALE1" "Bruno"
AddVoice "en-US" "FEMALE1" "Rosie"
AddVoice "en-US" "MALE1" "Hugo"
AddVoice "en-US" "FEMALE1" "Kiki"
AddVoice "en-US" "MALE1" "Leo"
DefaultVoice "Jasper"
